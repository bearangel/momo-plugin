<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>邮件</title>
<style>
  :root { --bg:#fff; --s1:#f7f7f8; --s2:#eeeef0; --tx:#1a1a1e; --tx2:#66666e; --tx3:#99999f; --bd:#e2e2e5; --acc:#3b6ef5; --err:#d33; --ok:#3a3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 12.5px/1.6 -apple-system, 'PingFang SC', sans-serif; height: 100vh; display: flex; color: var(--tx); background: var(--bg); }
  .col-left { width: 200px; border-right: 1px solid var(--bd); overflow: auto; padding: 8px; flex-shrink: 0; }
  .col-mid { width: 320px; border-right: 1px solid var(--bd); display: flex; flex-direction: column; flex-shrink: 0; }
  .col-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #reader { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  .mail-tools { display: flex; gap: 8px; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--bd); color: var(--tx3); font-size: 11px; }
  .acc { padding: 6px 8px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .acc:hover, .acc.on { background: var(--s2); }
  .acc .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .acc .dot.err { background: var(--err); }
  .folder { padding: 3px 8px 3px 22px; color: var(--tx2); cursor: pointer; border-radius: 4px; display: flex; justify-content: space-between; }
  .folder:hover, .folder.on { background: var(--s2); color: var(--tx); }
  .folder .n { color: var(--tx3); }
  .toolbar { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--bd); }
  .col-left .toolbar { flex-direction: column; align-items: stretch; }
  .col-left .toolbar button { white-space: nowrap; }
  input, select, textarea { font: inherit; border: 1px solid var(--bd); border-radius: 5px; padding: 4px 8px; background: var(--bg); color: var(--tx); min-width: 0; }
  .mail { padding: 7px 10px; border-bottom: 1px solid var(--bd); cursor: pointer; }
  .mail:hover, .mail.on { background: var(--s1); }
  .mail .subj { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail.unread .subj::before { content: '● '; color: var(--acc); }
  .mail .meta { display: flex; justify-content: space-between; color: var(--tx3); font-size: 11px; }
  .mail .meta .att { color: var(--acc); }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 6px; color: var(--tx3); }
  button { font: inherit; border: 1px solid var(--bd); background: var(--s1); color: var(--tx); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
  button.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .hd { padding: 10px 14px; border-bottom: 1px solid var(--bd); }
  .hd .subj { font-size: 14px; font-weight: 700; }
  .hd .m { color: var(--tx2); font-size: 11.5px; }
  .body { padding: 12px 14px; white-space: pre-wrap; word-break: break-word; }
  .att-row { display: flex; gap: 10px; padding: 3px 0; color: var(--tx2); }
  .hint { color: var(--tx3); font-size: 11px; }
  .status { padding: 4px 8px; min-height: 20px; color: var(--tx3); }
  .status.err { color: var(--err); }
  #account-form { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; }
  #account-form .box { background: var(--bg); border: 1px solid var(--bd); border-radius: 10px; padding: 16px; width: 380px; display: flex; flex-direction: column; gap: 8px; }
  #account-form label { font-size: 11px; color: var(--tx2); }
  .draft .ops { display: flex; gap: 8px; margin-top: 6px; }
  #confirm-bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--bg); border: 1px solid var(--bd); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.2); padding: 10px 14px; display: none; align-items: center; gap: 12px; z-index: 30; max-width: 80%; }
  #confirm-bar .msg { color: var(--tx); }
  #compose { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; }
  #compose .box { background: var(--bg); border: 1px solid var(--bd); border-radius: 10px; padding: 16px; width: 480px; display: flex; flex-direction: column; gap: 8px; max-height: 90vh; overflow: auto; }
  #compose label { font-size: 11px; color: var(--tx2); }
  #compose textarea { min-height: 160px; resize: vertical; }
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 6px 14px; border-radius: 6px; display: none; z-index: 40; }
</style>
</head>
<body>
  <div class="col-left">
    <div class="toolbar"><button class="pri" onclick="openAccountForm('add')">+ 添加帐号</button><button onclick="openAccountForm('edit')">编辑帐号</button></div>
    <div id="folders"></div>
  </div>
  <div class="col-mid">
    <div class="toolbar">
      <button class="pri" onclick="openCompose()">写邮件</button>
      <input id="q" placeholder="搜索主题" style="flex:1" onkeydown="if(event.key==='Enter')reloadList()">
      <button onclick="reloadList(true)">刷新</button>
    </div>
    <div id="sync-status" class="hint" style="padding:0 10px 4px;display:none"></div>
    <div id="maillist" style="flex:1;overflow:auto"></div>
    <div class="pager">
      <button onclick="turnPage(-1)">‹ 上一页</button>
      <span id="pageinfo"></span>
      <button onclick="turnPage(1)">下一页 ›</button>
    </div>
  </div>
  <div class="col-right"><div id="reader"><p class="hint" style="padding:14px">选择左侧邮件查看</p></div></div>

  <div id="account-form">
    <div class="box">
      <b id="account-form-title">添加邮箱账号</b>
      <label>常用预设</label>
      <select id="f-preset" onchange="applyPreset()"><option value="">— 选择或自定义 —</option><option value="qq">QQ 邮箱</option><option value="163">163 邮箱</option><option value="gmail">Gmail</option><option value="outlook">Outlook</option></select>
      <label>邮箱地址</label><input id="f-email" placeholder="you@example.com" oninput="applyPreset()">
      <label>显示名（可选）</label><input id="f-name">
      <label>IMAP 服务器 / 端口 / 加密</label>
      <div style="display:flex;gap:6px"><input id="f-ih" style="flex:1"><input id="f-ip" style="width:64px"><select id="f-it"><option value="tls">TLS(993)</option><option value="starttls">STARTTLS(143)</option></select></div>
      <label>SMTP 服务器 / 端口 / 加密</label>
      <div style="display:flex;gap:6px"><input id="f-sh" style="flex:1"><input id="f-sp" style="width:64px"><select id="f-st"><option value="tls">TLS(465)</option><option value="starttls">STARTTLS(587)</option></select></div>
      <label>用户名（通常=邮箱地址）</label><input id="f-user">
      <label>授权码 / 应用密码（不回显，存系统钥匙串）</label><input id="f-pw" type="password">
      <label>本地缓存保留时长</label>
      <select id="f-retention"><option value="forever">永久（默认）</option><option value="1y">一年</option><option value="6m">半年</option><option value="1m">一个月</option></select>
      <div class="hint">仅影响本地缓存，不会删除服务器邮件；已发送永久保留</div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button onclick="closeAccountForm()">取消</button>
        <button onclick="testAccount()">测试连接</button>
        <button class="pri" onclick="saveAccount()">保存</button>
      </div>
      <div class="status" id="f-status"></div>
    </div>
  </div>

  <div id="compose">
    <div class="box">
      <b>写邮件</b>
      <label>收件人（逗号分隔）</label><input id="c-to" placeholder="someone@example.com">
      <label>抄送（可选，逗号分隔）</label><input id="c-cc">
      <label>主题</label><input id="c-subject">
      <label>正文</label><textarea id="c-body"></textarea>
      <label>附件（总量 ≤25MB）</label><input id="c-files" type="file" multiple>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button id="c-cancel" onclick="closeCompose()">取消</button>
        <button id="c-draft" onclick="submitCompose('draft')">存草稿</button>
        <button id="c-send" class="pri" onclick="submitCompose('send')">发送</button>
      </div>
      <div class="status" id="c-status"></div>
    </div>
  </div>


  <div id="toast"></div>

  <div id="confirm-bar" style="display:none">
    <span class="msg"></span>
    <button class="ok">确认</button>
    <button class="cancel">取消</button>
  </div>

<script>
  // PanelChannel 胶水（codegraph 同款协议）：postMessage '*' + rpc:result 回包 + ready 握手
  var seq = 0, pending = {};
  function send(type, extra) {
    var id = ++seq;
    parent.postMessage(Object.assign({ type: type, id: id }, extra || {}), '*');
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      // 60s：patient 读信（大邮件慢链路）需要比旧 30s 更长的预算
      setTimeout(function () { if (pending[id]) { pending[id].reject(new Error('rpc 超时')); delete pending[id]; } }, 60000);
    });
  }
  window.addEventListener('message', function (ev) {
    var m = ev.data;
    if (!m || m.type !== 'rpc:result' || !pending[m.id]) return;
    if (m.error !== undefined) pending[m.id].reject(new Error(String(m.error)));
    else pending[m.id].resolve(m.result);
    delete pending[m.id];
  });
  function call(method, params) { return send('plugin:callService', { method: method, params: params || {} }); }
  window.call = call;

  // 状态
  var S = { accounts: [], accId: null, folders: null, folder: 'INBOX', page: 1, pageSize: 20, total: 0, mails: [], testOk: false, showRemoteImages: false, curMail: null, composeBusy: false, editId: null, reqSeq: 0, remoteOverride: null };
  var PRESETS = {
    qq: { ih: 'imap.qq.com', ip: 993, it: 'tls', sh: 'smtp.qq.com', sp: 465, st: 'tls' },
    '163': { ih: 'imap.163.com', ip: 993, it: 'tls', sh: 'smtp.163.com', sp: 465, st: 'tls' },
    gmail: { ih: 'imap.gmail.com', ip: 993, it: 'tls', sh: 'smtp.gmail.com', sp: 465, st: 'tls' },
    outlook: { ih: 'outlook.office365.com', ip: 993, it: 'tls', sh: 'smtp.office365.com', sp: 587, st: 'starttls' },
  };
  function $(id) { return document.getElementById(id); }
  // 文本节点上下文转义
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  // 属性值上下文转义（& < > " ' 五类全覆盖——服务端下发的文本进属性须全转）
  function attrEsc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  // 列表/草稿类错误可见化：写入 #maillist 顶部红字 hint 行（不覆盖既有列表内容）
  function showListError(msg) {
    var box = $('maillist');
    var line = document.createElement('p');
    line.className = 'hint';
    line.style.padding = '10px';
    line.style.color = 'var(--err)';
    line.textContent = String(msg == null ? '' : msg);
    box.insertBefore(line, box.firstChild);
  }
  // 宿主面板 iframe 无 allow-modals：原生弹窗不可用——面板自绘确认条
  var confirmPending = null;
  // 关闭确认条并把未决确认按「取消」结算（切账号时防串号/防误删）
  function cancelConfirm() {
    var bar = $('confirm-bar');
    if (bar) bar.style.display = 'none';
    if (confirmPending) { var prev = confirmPending; confirmPending = null; prev(false); }
  }
  function inlineConfirm(message) {
    if (confirmPending) { var prev = confirmPending; confirmPending = null; prev(false); }
    var bar = $('confirm-bar');
    var msgEl = bar.querySelector('.msg');
    var okBtn = bar.querySelector('.ok');
    var cancelBtn = bar.querySelector('.cancel');
    msgEl.textContent = String(message == null ? '' : message);
    okBtn.onclick = null;
    cancelBtn.onclick = null;
    bar.style.display = 'flex';
    return new Promise(function (resolve) {
      function finish(v) {
        bar.style.display = 'none';
        okBtn.onclick = null;
        cancelBtn.onclick = null;
        if (confirmPending === resolve) confirmPending = null;
        resolve(v);
      }
      confirmPending = resolve;
      okBtn.onclick = function () { finish(true); };
      cancelBtn.onclick = function () { finish(false); };
    });
  }

  // 主题跟随：ready 回包携 tokens（有则覆写 CSS 变量）
  function applyTheme(res) {
    if (!res || !res.tokens) return;
    var map = { '--bg': 'bg-canvas', '--s1': 'surface-1', '--s2': 'surface-2', '--tx': 'text-primary', '--tx2': 'text-secondary', '--tx3': 'text-tertiary', '--bd': 'border-subtle', '--acc': 'accent-500' };
    var st = document.documentElement.style;
    for (var k in map) { var v = res.tokens['--' + map[k]]; if (v) st.setProperty(k, v); }
  }

  function renderAccounts() {
    var h = '';
    S.accounts.forEach(function (a) {
      h += '<div class="acc' + (a.id === S.accId ? ' on' : '') + '" data-acc="' + attrEsc(a.id) + '" onclick="pickAccount(this.dataset.acc)">' +
        '<span class="dot' + (a.health && a.health.state === 'error' ? ' err' : '') + '" title="' + attrEsc(a.health && a.health.message || '') + '"></span>' + esc(a.displayName || a.email) +
        (a.health && a.health.state === 'error' ? ' <span class="hint">!</span>' : '') + '</div>';
      if (a.id === S.accId && S.folders) {
        var items = [{ p: 'INBOX', t: '收件箱' }, { p: S.folders.drafts, t: '草稿箱' }, { p: S.folders.sent, t: '已发送' }];
        items.forEach(function (it) {
          if (!it.p) return;
          var unseen = (S.folders.unseen && S.folders.unseen[it.p]) || 0;
          h += '<div class="folder' + (S.folder === it.p ? ' on' : '') + '" data-folder="' + attrEsc(it.p) + '" onclick="pickFolder(this.dataset.folder)"><span>' + it.t + '</span>' + (unseen > 0 ? '<span class="n">' + Number(unseen) + '</span>' : '') + '</div>';
        });
      }
    });
    h += '<div class="folder" style="color:var(--tx3)" onclick="delAccount()">删除当前账号…</div>';
    $('folders').innerHTML = h || '<p class="hint" style="padding:8px">尚未配置邮箱——点击「+ 添加账号」</p>';
  }

  function renderList(keepScroll) {
    var box = $('maillist');
    var keep = keepScroll ? box.scrollTop : 0;
    var h = '';
    S.mails.forEach(function (m) {
      var uid = Number(m.uid);
      h += '<div class="mail' + (!m.seen ? ' unread' : '') + (uid === S.selUid ? ' on' : '') + '" data-uid="' + uid + '" onclick="openMail(Number(this.dataset.uid))">' +
        '<div class="subj">' + esc(m.subject || '(无主题)') + '</div>' +
        '<div class="meta"><span>' + esc(m.from) + '</span><span>' + (m.hasAttachments ? '<span class="att">附件 </span>' : '') + esc((m.date || '').slice(0, 16).replace('T', ' ')) + '</span></div></div>';
    });
    box.innerHTML = h || '<p class="hint" style="padding:10px">无邮件</p>';
    box.scrollTop = keep;
    $('pageinfo').textContent = S.page + ' / ' + Math.max(1, Math.ceil(S.total / S.pageSize)) + '（' + S.total + '）';
  }

  function setSyncStatus(text) {
    var el = $('sync-status');
    el.textContent = text || '';
    el.style.display = text ? 'block' : 'none';
  }

  function currentFilter() {
    var filter = {};
    var q = $('q').value.trim();
    if (q) filter.subject = q;
    return filter;
  }

  function renderDraftBox() {
    // 只在草稿箱拉草稿：避免每次切账号/翻页都多打一次 drafts.list。
    if (!S.folders || S.folder !== S.folders.drafts) return;
    call('drafts.list').then(function (ds) {
      var pendingDrafts = (ds || []).filter(function (d) { return d.status === 'pending' && d.accountId === S.accId; });
      if (S.folder !== S.folders.drafts || pendingDrafts.length === 0) return;
      var h = '<div style="padding:8px 10px;border-bottom:1px solid var(--bd)"><b>待确认草稿（' + pendingDrafts.length + '）</b></div>';
      pendingDrafts.forEach(function (d) {
        h += '<div class="mail draft" style="margin:0"><div class="subj">→ ' + esc((d.to || []).join(', ')) + '：' + esc(d.subject) + '</div>' +
          '<div class="meta"><span>' + esc(d.summary) + '</span></div>' +
          '<div class="ops"><button class="pri" data-draft="' + attrEsc(d.id) + '" onclick="sendDraft(this.dataset.draft)">发送</button>' +
          '<button data-draft="' + attrEsc(d.id) + '" onclick="discardDraft(this.dataset.draft)">放弃</button></div></div>';
      });
      $('maillist').innerHTML = h + $('maillist').innerHTML;
    }).catch(function (e) { showListError('草稿列表加载失败：' + e.message); });
  }

  function reloadList(force) {
    if (!S.accId) return;
    var filter = currentFilter();
    var seq = ++S.reqSeq;
    var accId = S.accId, folder = S.folder, page = S.page, pageSize = S.pageSize;
    var same = function () { return seq === S.reqSeq && S.accId === accId && S.folder === folder && S.page === page; };
    var apply = function (p) { S.mails = p.items || []; S.total = p.total || 0; };
    setSyncStatus('更新中…');
    if (force) {
      call('mails.refresh', { accountId: accId, folder: folder, page: page, pageSize: pageSize, filter: filter })
        .then(function (p) { if (!same()) return; apply(p); renderList(false); renderDraftBox(); setSyncStatus(''); })
        .catch(function () { if (same()) setSyncStatus('离线：显示上次数据'); });
      return;
    }
    call('mails.peek', { accountId: accId, folder: folder, page: page, pageSize: pageSize })
      .catch(function () { return { items: [], total: 0 }; })
      .then(function (peek) {
        if (!same()) return;
        // 无本地缓存时保留旧列表（避免定时刷新闪空），后台结果再替换。
        if ((peek.items && peek.items.length) || !S.mails.length) { apply(peek); renderList(true); }
        return call('mails.list', { accountId: accId, folder: folder, page: page, pageSize: pageSize, filter: filter })
          .then(function (p) { if (!same()) return; apply(p); renderList(true); renderDraftBox(); setSyncStatus(''); })
          .catch(function () { if (same()) setSyncStatus('离线：显示上次数据'); });
      });
  }

  // HTML 邮件内层文档：默认禁远程资源（跟踪像素/外链字体/CSS）；用户可一键放行图片。
  // 脚本仍由 sandbox="" 禁用（安全底线），CSP 只负责资源加载面。
  function mailCsp(allowRemote) {
    return 'default-src \'none\'; img-src data: cid:' + (allowRemote ? ' https: http:' : '') + '; style-src \'unsafe-inline\'';
  }
  function toggleRemoteImages() {
    S.remoteOverride = !S.showRemoteImages;
    S.showRemoteImages = S.remoteOverride;
    if (S.curMail) renderMail(S.curMail);
  }
  function renderMail(m) {
    var h = '<div class="hd"><div class="subj">' + esc(m.subject) + '</div>' +
      '<div class="m">发件人 ' + esc(m.from) + ' · ' + esc((m.date || '').replace('T', ' ').slice(0, 19)) + (m.truncated ? ' · <span style="color:var(--err)">正文已截断</span>' : '') + '</div></div>';
    if (typeof m.html === 'string' && m.html.trim() !== '') {
      var tools = '<div class="mail-tools"><span>' + (S.showRemoteImages ? '已允许远程图片' : '远程图片已屏蔽（防跟踪）') + '</span>' +
        '<button style="padding:2px 8px" onclick="toggleRemoteImages()">' + (S.showRemoteImages ? '屏蔽远程图片' : '显示远程图片') + '</button></div>';
      // 组装 srcdoc 前剥离 meta refresh：自导航不落 CSP 管辖，仍可触发跟踪请求
      var safeHtml = String(m.html || '').replace(/<meta[^>]*http-equiv\s*=\s*["']?refresh["']?[^>]*>/gi, '');
      var doc = '<!DOCTYPE html><html><head><meta http-equiv="Content-Security-Policy" content="' + mailCsp(S.showRemoteImages) + '"><base target="_self"></head><body>' + safeHtml + '</body></html>';
      h += tools + '<iframe sandbox="" style="width:100%;flex:1;min-height:280px;border:0;background:#fff" srcdoc="' + attrEsc(doc) + '"></iframe>';
    } else {
      var bodyText = String(m.text == null ? '' : m.text);
      h += '<div class="body">' + (bodyText.trim() ? esc(bodyText) : '<span class="hint">（无正文）</span>') + '</div>';
    }
    if (m.attachments && m.attachments.length) {
      h += '<div class="hd"><b>附件</b>（保存到工作区请在会话中让邮件助手处理）</div><div style="padding:0 14px 14px">';
      m.attachments.forEach(function (a) { h += '<div class="att-row">[附件] ' + esc(a.filename) + ' <span class="hint">' + Math.ceil((a.size || 0) / 1024) + ' KB</span></div>'; });
      h += '</div>';
    }
    $('reader').innerHTML = h;
  }
  // 点击读信即时去未读标记：本地信封 seen 置真 + 文件夹未读数减 1
  //（服务器侧由 service 读信后 best-effort 置 \Seen；未读数下次 folders.list 自然校正）。
  function markSeenLocal(uid) {
    var hit = null;
    for (var i = 0; i < S.mails.length; i += 1) { if (Number(S.mails[i].uid) === uid) { hit = S.mails[i]; break; } }
    if (!hit || hit.seen) return;
    hit.seen = true;
    if (S.folders && S.folders.unseen && Number(S.folders.unseen[S.folder]) > 0) {
      S.folders.unseen[S.folder] = Number(S.folders.unseen[S.folder]) - 1;
      renderAccounts();
    }
    renderList(true);
  }
  function openMail(uid) {
    uid = Number(uid);
    S.selUid = uid;
    // 远程图片默认值每次开信重读配置（设置页改开关即生效）；面板内按钮只做会话级覆盖
    call('config.get', {}).then(function (cfg) {
      S.showRemoteImages = S.remoteOverride != null ? S.remoteOverride : !!(cfg && cfg.showRemoteImages);
      if (S.curMail) renderMail(S.curMail);
    }).catch(function () {});
    S.curMail = null;
    renderList(true);
    $('reader').innerHTML = '<p class="hint" style="padding:14px">读取中…</p>';
    // patient：大邮件走 service 25s 慢预算（面板 RPC 自身 60s 兜底）
    call('mails.get', { accountId: S.accId, folder: S.folder, uid: uid, patient: true }).then(function (m) {
      S.curMail = m;
      markSeenLocal(uid);
      renderMail(m);
    }).catch(function (e) { $('reader').innerHTML = '<p class="hint" style="padding:14px;color:var(--err)">' + esc(e.message) + '</p>'; });
  }

  // —— 账号表单 ——
  function openAccountForm(mode) {
    var edit = mode === 'edit';
    S.testOk = false;
    S.editId = null;
    ['f-email', 'f-name', 'f-user', 'f-ih', 'f-ip', 'f-sh', 'f-sp', 'f-pw'].forEach(function (id) { $(id).value = ''; });
    $('f-preset').value = '';
    $('f-it').value = 'tls';
    $('f-st').value = 'tls';
    $('f-retention').value = 'forever';
    $('f-email').readOnly = false;
    $('f-pw').placeholder = '授权码 / 应用密码（不回显，存系统钥匙串）';
    $('account-form-title').textContent = edit ? '编辑邮箱账号' : '添加邮箱账号';
    if (edit) {
      if (!S.accId) { showListError('请先选择账号'); return; }
      var a = (S.accounts || []).filter(function (x) { return x.id === S.accId; })[0];
      if (!a) { showListError('请先选择账号'); return; }
      S.editId = a.id;
      $('f-email').value = a.email;
      $('f-email').readOnly = true;
      $('f-name').value = a.displayName || '';
      $('f-user').value = a.username || '';
      $('f-ih').value = a.imap.host; $('f-ip').value = a.imap.port; $('f-it').value = a.imap.tlsMode;
      $('f-sh').value = a.smtp.host; $('f-sp').value = a.smtp.port; $('f-st').value = a.smtp.tlsMode;
      $('f-retention').value = a.retention || 'forever';
      $('f-pw').value = '';
      $('f-pw').placeholder = '留空则不修改';
    }
    $('account-form').style.display = 'flex';
    $('f-status').textContent = '';
  }
  function closeAccountForm() { S.editId = null; $('account-form').style.display = 'none'; }
  // 任何表单改动都使既有「测试通过」失效——保存前必须重新测试（spec §5.2）
  function resetTestOk() { S.testOk = false; }
  function applyPreset() {
    var key = $('f-preset').value || presetKeyOf($('f-email').value);
    if (key && PRESETS[key]) { var p = PRESETS[key]; $('f-ih').value = p.ih; $('f-ip').value = p.ip; $('f-it').value = p.it; $('f-sh').value = p.sh; $('f-sp').value = p.sp; $('f-st').value = p.st; $('f-user').value = $('f-email').value; }
  }
  // 域名 → 预设键（与服务端 lib/accounts.js presetFor 同规则）
  function presetKeyOf(email) {
    var domain = String(email || '').split('@')[1] || '';
    if (domain === 'qq.com' || domain === 'foxmail.com') return 'qq';
    if (domain.endsWith('163.com')) return '163';
    if (domain === 'gmail.com') return 'gmail';
    if (domain.endsWith('outlook.com') || domain.endsWith('hotmail.com')) return 'outlook';
    return '';
  }
  function formInput() {
    return { email: $('f-email').value.trim(), displayName: $('f-name').value.trim() || null, username: $('f-user').value.trim() || $('f-email').value.trim(), password: $('f-pw').value,
      retention: $('f-retention').value,
      imap: { host: $('f-ih').value.trim(), port: Number($('f-ip').value), tlsMode: $('f-it').value },
      smtp: { host: $('f-sh').value.trim(), port: Number($('f-sp').value), tlsMode: $('f-st').value } };
  }
  function testAccount() {
    $('f-status').className = 'status'; $('f-status').textContent = '连接测试中…';
    call('accounts.test', formInput()).then(function (r) {
      S.testOk = !!r.ok;
      $('f-status').className = 'status' + (r.ok ? '' : ' err');
      $('f-status').textContent = r.ok ? '连接成功 ✓（可保存）' : '失败：' + r.error;
    }).catch(function (e) { S.testOk = false; $('f-status').className = 'status err'; $('f-status').textContent = e.message; });
  }
  // 编辑态仅改保留时长/显示名（及密码留空）时无需重新测试；连接字段或密码变更才要求测试。
  function needsRetest() {
    if (!S.editId) return true;
    var a = (S.accounts || []).filter(function (x) { return x.id === S.editId; })[0];
    if (!a) return true;
    var f = formInput();
    if (f.password !== '') return true;
    return f.username !== a.username
      || f.imap.host !== a.imap.host || Number(f.imap.port) !== Number(a.imap.port) || f.imap.tlsMode !== a.imap.tlsMode
      || f.smtp.host !== a.smtp.host || Number(f.smtp.port) !== Number(a.smtp.port) || f.smtp.tlsMode !== a.smtp.tlsMode;
  }
  function saveAccount() {
    if (S.testOk !== true && needsRetest()) { $('f-status').className = 'status err'; $('f-status').textContent = '请先测试连接'; return; }
    var input = formInput();
    if (S.editId) {
      var patch = { displayName: input.displayName, username: input.username, retention: input.retention, imap: input.imap, smtp: input.smtp };
      if (input.password !== '') patch.password = input.password;
      call('accounts.update', { id: S.editId, patch: patch }).then(function () { closeAccountForm(); boot(); })
        .catch(function (e) { $('f-status').className = 'status err'; $('f-status').textContent = e.message; });
      return;
    }
    call('accounts.add', input).then(function () { closeAccountForm(); boot(); })
      .catch(function (e) { $('f-status').className = 'status err'; $('f-status').textContent = e.message; });
  }

  function delAccount() {
    if (!S.accId) return;
    // 目标快照：确认条无遮罩，期间可切换账号——删除目标以进入确认时为准，不读后续的 S.accId
    var targetId = S.accId;
    var target = (S.accounts || []).filter(function (a) { return a.id === targetId; })[0];
    inlineConfirm('删除邮箱账号 ' + (target ? (target.displayName || target.email) : targetId) + '？（本地配置与凭据，不动服务器）').then(function (ok) {
      if (!ok) return;
      call('accounts.delete', { id: targetId }).then(function () { S.editId = null; if (S.accId === targetId) S.accId = null; boot(); })
        .catch(function (e) { showListError('删除账号失败：' + e.message); });
    });
  }

  // —— 草稿操作（人工确认发送通道）——
  function sendDraft(id) {
    inlineConfirm('确认发送这封草稿？').then(function (ok) {
      if (!ok) return;
      call('drafts.send', { draftId: id }).then(function () { reloadList(true); })
        .catch(function (e) { showListError('发送失败：' + e.message); reloadList(true); });
    });
  }
  function discardDraft(id) {
    call('drafts.discard', { draftId: id }).then(function () { reloadList(true); })
      .catch(function (e) { showListError('放弃草稿失败：' + e.message); });
  }

  // —— 写邮件（SMTP 直发；复用 drafts.save → drafts.send 通道） ——
  function openCompose() {
    if (!S.accId) { showListError('请先添加账号'); return; }
    S.composeBusy = false;
    ['c-to', 'c-cc', 'c-subject', 'c-body'].forEach(function (id) { $(id).value = ''; });
    $('c-files').value = '';
    setComposeStatus('');
    $('compose').style.display = 'flex';
  }
  function closeCompose() { if (S.composeBusy) return; $('compose').style.display = 'none'; }
  function setComposeStatus(msg, isErr) {
    var el = $('c-status');
    el.className = 'status' + (isErr ? ' err' : '');
    el.textContent = msg || '';
  }
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(function () { el.style.display = 'none'; }, 3500);
  }
  function splitList(v) { return String(v || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean); }
  function setComposeBusy(busy) {
    S.composeBusy = busy;
    $('c-send').disabled = busy;
    $('c-draft').disabled = busy;
    $('c-cancel').disabled = busy;
  }
  function readAttachments(files) {
    return Promise.all(Array.prototype.map.call(files || [], function (f) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () { resolve({ filename: f.name, contentType: f.type || 'application/octet-stream', base64: String(r.result).split(',')[1] || '' }); };
        r.onerror = function () { reject(new Error('读取附件失败：' + f.name)); };
        r.readAsDataURL(f);
      });
    }));
  }
  function submitCompose(mode) {
    if (S.composeBusy) return;
    var to = splitList($('c-to').value);
    if (mode === 'send' && to.length === 0) { setComposeStatus('请填写收件人', true); return; }
    var files = $('c-files').files || [];
    var total = 0;
    for (var i = 0; i < files.length; i += 1) total += files[i].size;
    if (total > 25 * 1024 * 1024) { setComposeStatus('附件总量超过 25MB 上限', true); return; }
    var payload = { accountId: S.accId, to: to, cc: splitList($('c-cc').value), subject: $('c-subject').value.trim(), text: $('c-body').value, attachments: [] };
    setComposeBusy(true);
    setComposeStatus(mode === 'send' ? '正在发送…' : '正在保存草稿…');
    readAttachments(files).then(function (attachments) {
      payload.attachments = attachments;
      if (mode !== 'send') {
        return call('drafts.save', payload).then(function () {
          setComposeBusy(false); $('compose').style.display = 'none'; toast('已存草稿'); reloadList(true);
        });
      }
      return inlineConfirm('确认发送这封邮件？').then(function (ok) {
        if (!ok) { setComposeBusy(false); setComposeStatus(''); return; }
        return call('drafts.save', payload)
          .then(function (d) { return call('drafts.send', { draftId: d.id }); })
          .then(function (sent) {
            var warn = (sent && sent.archiveWarning) || (sent && sent.deleteWarning);
            setComposeBusy(false);
            $('compose').style.display = 'none';
            toast(warn ? '已发送；' + warn : '已发送');
            reloadList(true);
          });
      });
    }).catch(function (e) {
      setComposeBusy(false);
      setComposeStatus(e && e.message ? e.message : String(e), true);
    });
  }
  function pickAccount(id) {
    cancelConfirm();
    S.accId = id; S.folder = 'INBOX'; S.page = 1;
    var seq = ++S.reqSeq;
    var same = function () { return seq === S.reqSeq && S.accId === id && S.folder === 'INBOX'; };
    setSyncStatus('更新中…');
    // 两阶段：peek 本地（内存/DB）秒开 → 后台 list/refresh 静默替换。
    Promise.all([
      call('folders.peek', { accountId: id }).catch(function () { return { value: null }; }),
      call('mails.peek', { accountId: id, folder: 'INBOX', page: 1, pageSize: S.pageSize }).catch(function () { return { items: [], total: 0 }; }),
    ]).then(function (r) {
      if (!same()) return;
      S.folders = (r[0] && r[0].value) || null;
      S.mails = (r[1] && r[1].items) || [];
      S.total = (r[1] && r[1].total) || 0;
      renderAccounts();
      renderList(false);
      return Promise.allSettled([
        call('folders.list', { accountId: id }),
        call('mails.refresh', { accountId: id, folder: 'INBOX', page: 1, pageSize: S.pageSize, filter: {} }),
      ]).then(function (res) {
        if (!same()) return;
        var okF = res[0].status === 'fulfilled';
        var okM = res[1].status === 'fulfilled';
        if (okF) S.folders = res[0].value;
        if (okM) { S.mails = res[1].value.items || []; S.total = res[1].value.total || 0; }
        if (okF) renderAccounts();
        if (okM) renderList(true);
        setSyncStatus(okF && okM ? '' : '离线：显示上次数据');
      });
    });
  }
  function pickFolder(p) {
    S.folder = p; S.page = 1;
    renderAccounts();
    if (!S.accId) return;
    var seq = ++S.reqSeq;
    var accId = S.accId;
    var same = function () { return seq === S.reqSeq && S.accId === accId && S.folder === p; };
    setSyncStatus('更新中…');
    call('mails.peek', { accountId: accId, folder: p, page: 1, pageSize: S.pageSize })
      .catch(function () { return { items: [], total: 0 }; })
      .then(function (peek) {
        if (!same()) return;
        S.mails = (peek && peek.items) || [];
        S.total = (peek && peek.total) || 0;
        renderList(false);
        renderDraftBox();
        return call('mails.refresh', { accountId: accId, folder: p, page: 1, pageSize: S.pageSize, filter: currentFilter() })
          .then(function (page) {
            if (!same()) return;
            S.mails = page.items || []; S.total = page.total || 0;
            renderList(true); renderDraftBox(); setSyncStatus('');
          })
          .catch(function () { if (same()) setSyncStatus('离线：显示上次数据'); });
      });
  }
  function turnPage(d) { S.page = Math.max(1, S.page + d); reloadList(); }

  function boot() {
    call('config.get', {}).then(function (cfg) { S.showRemoteImages = !!(cfg && cfg.showRemoteImages); }).catch(function () {});
    call('accounts.list').then(function (accs) {
      S.accounts = accs || [];
      if (!S.accId && S.accounts.length) { pickAccount(S.accounts[0].id); } else { renderAccounts(); }
    }).catch(function (e) { $('folders').innerHTML = '<p class="hint" style="padding:8px;color:var(--err)">' + esc(e.message) + '</p>'; });
  }

  ['f-preset', 'f-email', 'f-name', 'f-ih', 'f-ip', 'f-it', 'f-sh', 'f-sp', 'f-st', 'f-user', 'f-pw'].forEach(function (id) {
    var el = $(id);
    if (!el) return;
    el.addEventListener('input', resetTestOk);
    el.addEventListener('change', resetTestOk);
  });

  send('ready').then(function (res) { applyTheme(res && res.result ? res.result : res); boot(); setInterval(function () { if (S.accId) reloadList(); }, 60000); })
    .catch(function (e) { $('folders').innerHTML = '<p class="hint" style="padding:8px;color:var(--err)">面板初始化失败：' + esc(e.message) + '</p>'; });
</script>
</body>
</html>
